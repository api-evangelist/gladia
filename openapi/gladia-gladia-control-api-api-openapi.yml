openapi: 3.2.0
info:
  title: Gladia Control API
  description: ''
  version: '1.0'
  contact: {}
servers:
- url: https://api.gladia.io/
  description: Gladia API production URL
tags:
- name: Gladia Control API
paths: {}
webhooks:
  transcription.created:
    post:
      description: Sent when a pre-recorded transcription job has been created
      responses: {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookTranscriptionCreatedPayload'
      tags:
      - Gladia Control API
      summary: Create transcription created
      x-summary-source: derived
  transcription.success:
    post:
      description: Sent when a pre-recorded transcription job is done and its results are available
      responses: {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookTranscriptionSuccessPayload'
      tags:
      - Gladia Control API
      summary: Create transcription success
      x-summary-source: derived
  transcription.error:
    post:
      description: Sent when an error occurred on a pre-recorded transcription job
      responses: {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookTranscriptionErrorPayload'
      tags:
      - Gladia Control API
      summary: Create transcription error
      x-summary-source: derived
  live.start_session:
    post:
      description: Sent when a live session has been initiated
      responses: {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookLiveStartSessionPayload'
      tags:
      - Gladia Control API
      summary: Create live start session
      x-summary-source: derived
  live.start_recording:
    post:
      description: Sent when we received the first audio chunk of a live session
      responses: {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookLiveStartRecordingPayload'
      tags:
      - Gladia Control API
      summary: Create live start recording
      x-summary-source: derived
  live.end_recording:
    post:
      description: Sent when the live session recording has ended
      responses: {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookLiveEndRecordingPayload'
      tags:
      - Gladia Control API
      summary: Create live end recording
      x-summary-source: derived
  live.end_session:
    post:
      description: Sent when the live session post-processing has ended and the results are available
      responses: {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookLiveEndSessionPayload'
      tags:
      - Gladia Control API
      summary: Create live end session
      x-summary-source: derived
components:
  schemas:
    WebhookLiveEndSessionPayload:
      type: object
      properties:
        event:
          type: string
          enum:
          - live.end_session
          default: live.end_session
          example: live.end_session
        payload:
          $ref: '#/components/schemas/LiveEventPayload'
      required:
      - event
      - payload
    LiveEventPayload:
      type: object
      properties:
        id:
          type: string
          description: Id of the job
          format: uuid
          example: 45463597-20b7-4af7-b3b3-f5fb778203ab
      required:
      - id
    WebhookTranscriptionSuccessPayload:
      type: object
      properties:
        event:
          type: string
          enum:
          - transcription.success
          default: transcription.success
          example: transcription.success
        payload:
          $ref: '#/components/schemas/PreRecordedEventPayload'
      required:
      - event
      - payload
    WebhookLiveStartRecordingPayload:
      type: object
      properties:
        event:
          type: string
          enum:
          - live.start_recording
          default: live.start_recording
          example: live.start_recording
        payload:
          $ref: '#/components/schemas/LiveEventPayload'
      required:
      - event
      - payload
    PreRecordedEventPayload:
      type: object
      properties:
        id:
          type: string
          description: Id of the job
          format: uuid
          example: 45463597-20b7-4af7-b3b3-f5fb778203ab
      required:
      - id
    WebhookTranscriptionErrorPayload:
      type: object
      properties:
        event:
          type: string
          enum:
          - transcription.error
          default: transcription.error
          example: transcription.error
        payload:
          $ref: '#/components/schemas/PreRecordedEventPayload'
      required:
      - event
      - payload
    WebhookTranscriptionCreatedPayload:
      type: object
      properties:
        event:
          type: string
          enum:
          - transcription.created
          default: transcription.created
          example: transcription.created
        payload:
          $ref: '#/components/schemas/PreRecordedEventPayload'
      required:
      - event
      - payload
    WebhookLiveEndRecordingPayload:
      type: object
      properties:
        event:
          type: string
          enum:
          - live.end_recording
          default: live.end_recording
          example: live.end_recording
        payload:
          $ref: '#/components/schemas/LiveEventPayload'
      required:
      - event
      - payload
    WebhookLiveStartSessionPayload:
      type: object
      properties:
        event:
          type: string
          enum:
          - live.start_session
          default: live.start_session
          example: live.start_session
        payload:
          $ref: '#/components/schemas/LiveEventPayload'
      required:
      - event
      - payload
  securitySchemes:
    x_gladia_key:
      type: apiKey
      in: header
      name: x-gladia-key
      description: Your personal Gladia API key
