                  - turkish
                  - turkmen
                  - ukrainian
                  - urdu
                  - uzbek
                  - vietnamese
                  - welsh
                  - yiddish
                  - yoruba
                transcription_hint:
                  type: string
                toggle_diarization:
                  type: boolean
                  default: false
                diarization_num_speakers:
                  type: integer
                diarization_min_speakers:
                  type: integer
                diarization_max_speakers:
                  type: integer
                toggle_direct_translate:
                  type: boolean
                  default: false
                target_translation_language:
                  type: string
                  enum:
                  - afrikaans
                  - albanian
                  - amharic
