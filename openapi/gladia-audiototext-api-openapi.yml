openapi: 3.0.3
info:
  title: Gladia Control AudioToText API
  description: Gladia AI audio infrastructure API for speech-to-text transcription via REST and WebSocket. Supports asynchronous pre-recorded audio processing and real-time live transcription with speaker diarization, automatic language detection across 100+ languages, and audio intelligence features.
  version: '1.0'
  contact: {}
servers:
- url: https://api.gladia.io/
  description: Gladia API production URL
tags:
- name: AudioToText
paths:
  /audio/text/audio-transcription:
    post:
      operationId: AudioToTextController_audioTranscription
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
                audio_url:
                  type: string
                  default: http://files.gladia.io/example/audio-transcription/split_infinity.wav
                language_behaviour:
                  type: string
                  enum:
                  - automatic single language
                  - automatic multiple languages
                  - manual
                  default: automatic single language
                language:
                  type: string
                  enum:
                  - afrikaans
                  - albanian
                  - amharic
                  - arabic
                  - armenian
                  - assamese
                  - azerbaijani
                  - bashkir
                  - basque
                  - belarusian
                  - bengali
                  - bosnian
                  - breton
                  - bulgarian
