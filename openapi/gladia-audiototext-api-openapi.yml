        '200':
          description: ''
      security:
      - x_gladia_key: []
      tags:
      - AudioToText
components:
  securitySchemes:
    x_gladia_key:
      type: apiKey
      in: header
      name: x-gladia-key
      description: Your personal Gladia API key
