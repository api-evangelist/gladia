                  - json
                  - srt
                  - vtt
                  - plain
                  - txt
                  default: json
                toggle_noise_reduction:
                  type: boolean
                  default: false
                toggle_accurate_words_timestamps:
                  type: boolean
                  default: false
                webhook_url:
                  type: string
